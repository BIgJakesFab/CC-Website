<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#101719">
  <title>{% if page.section == 'home' %}Crafted Creations — Ideas made real{% else %}{{ page.title | escape }} | Crafted Creations{% endif %}</title>
  <link rel="icon" href="{{ '/assets/crafted-creations-crest.webp' | relative_url }}">
  <!-- Free GitHub Pages Midnight Jekyll theme, followed by our custom workshop styling -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header>
  <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/crafted-creations-crest.webp' | relative_url }}" alt="Crafted Creations logo"><span>CRAFTED<br>CREATIONS<small>DESIGN · CREATE · BUILD</small></span></a>
  <button id="menu" aria-label="Open navigation" aria-expanded="false">☰</button>
  <nav id="nav">
    <a href="{{ '/#work' | relative_url }}">The work</a>
    <a href="{{ '/saw-blades.html' | relative_url }}"{% if page.section == 'saw' %} aria-current="page"{% endif %}>Saw Blades</a>
    <a href="{{ '/wood-projects.html' | relative_url }}"{% if page.section == 'wood' %} aria-current="page"{% endif %}>Wood Projects</a>
    <a href="{{ '/#capabilities' | relative_url }}">What we do</a>
    <a href="{{ '/#watch' | relative_url }}">In the workshop</a>
    <a href="{{ '/#contact' | relative_url }}" class="nav-cta">Let's make something ↗</a>
  </nav>
  <a class="coffee-link" href="https://buymeacoffee.com/craftedcreations2023" target="_blank" rel="noopener" aria-label="Support Crafted Creations on Buy Me a Coffee">
    <span class="coffee-icon" aria-hidden="true">☕</span><span class="coffee-label">Buy Me a Coffee</span>
  </a>
</header>
{{ content }}
<footer>
  <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/crafted-creations-crest.webp' | relative_url }}" alt=""><span>CRAFTED CREATIONS<small>DESIGN · CREATE · BUILD</small></span></a>
  <p>A little ingenuity goes a long way.</p>
  <div><a href="https://www.youtube.com/@craftedcreations2023/shorts" target="_blank" rel="noopener">YouTube ↗</a><a href="https://www.facebook.com/CraftedCreations2023" target="_blank" rel="noopener">Facebook ↗</a></div>
  <small>© <span id="year"></span> Crafted Creations</small>
</footer>
<script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body>
</html>
